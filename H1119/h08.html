<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>
    <title>Document</title>
    <style>
        .c01{width: 100px; height: 100px; border:1px solid black;}
        .on{background: yellow;}
        .off{background: navy;}
    </style>
    <script>
        $(function(){
            $("#cBtn").click(()=>{
                $(".c01").addClass("on");
               // $(".c01").addClass("on");

            })

            $("#cBtn").click(()=>{
                $(".c01").addClass("on");
                $(".c01").removeClass("off");

            })
            // 자바스크립트 vs jquery-$(this)
            // 화살표함수에는 $(this)가 안됨
            // 화살표함수에 $(this)를 사용하려면 (e) -> e.target
            $("input[type='text']").focus(function(){
                $(this).close.addClass("on");
            })
            $("input[type='text']").focusout(function(){
                $(this).close.addClass("on");
            })
            /*$("#cBtn").click(function(){

            })*/

            $("#imgBtn").click(function(){
                $("img").attr("src","image/ba")
            })
        })
    </script>
</head>
<body>
    <img src=""><br>
    <button>변경</button>
    <div class="c01"></div>
    <button type="button" id="cBtn">확인</button>
    <button type="button" id="canBtn">취소</button>

    <input type="text" class="c00" name="no"><br>
    <input type="text" class="c00" name="name"><br>
    <input type="text" class="c00" name="kor"><br>
    <input type="text" class="c00" name="eng"><br>
</body>
</html>
